[versions]
agp = "9.2.1"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.3.21"   # raised from the scaffold's 2.2.10 — see the ksp note below
composeBom = "2026.02.01"

# ---------------------------------------------------------------------------------------------------
# Added for the PhoneCleanerDemo architecture (LLM.md §10.3).
# RESOLVED 2026-09-02 by reading maven-metadata.xml directly from Google Maven and Maven Central —
# not from model memory, which ends before these releases. Each is the newest release with no
# alpha/beta/rc/dev/snapshot qualifier. The eight versions the Android Studio scaffold had already
# pinned (agp, kotlin, composeBom, coreKtx, lifecycleRuntimeKtx, activityCompose, junitVersion,
# espressoCore) were verified to exist in the same pass; none was changed.
# ---------------------------------------------------------------------------------------------------
# WHY kotlin IS 2.3.21 AND NOT THE LATEST 2.4.10 — established by build, 2026-09-02.
#   Coil 3.6.1 depends on kotlin-stdlib 2.4.10, and conflict resolution raises the whole graph to it.
#   The scaffold's Kotlin 2.2.10 compiler cannot read that: "metadata version 2.4.0, compiler 2.2.0
#   can read up to 2.3.0". A 2.3.x compiler reads up to 2.4.0, so it can.
#   2.4.10 would also work — except KSP has NO 2.4 build. Its newest, 2.3.11, pins kotlin-stdlib
#   2.3.20, so it is built for the 2.3 line. Room needs KSP, so the Kotlin line follows KSP.
#   Revisit when a KSP for Kotlin 2.4 ships.
# ---------------------------------------------------------------------------------------------------
ksp                         = "2.3.11"                 # KSP moved to its own semver line; it is NO LONGER "<kotlin>-<n>"
coroutines                  = "1.11.0"
serialization               = "1.11.0"        # runtime only; the PLUGIN version is `kotlin`
kotlinxDatetime             = "0.8.0"         # mainline, NOT the `-0.6.x-compat` variant that sorts after it
kotlinxCollectionsImmutable = "0.5.2"         # ImmutableList is load-bearing — LLM.md §8
koin                        = "4.2.2"         # koin-androidx-compose / -workmanager move with koin-android
room                        = "2.8.4"
datastore                   = "1.2.1"
work                        = "2.11.2"
# lifecycle — NOT a new key: the androidx.lifecycle group is already pinned by `lifecycleRuntimeKtx` above.
#             Every lifecycle artifact must share one version, so the new ones below reuse that ref.
navigation                  = "2.10.0"        # type-safe @Serializable routes — LLM.md §7.2
coil                        = "3.6.1"         # coil3 group
lottie                      = "6.7.1"         # decoration only; never gates data — LLM.md §12
exifinterface               = "1.4.2"
documentfile                = "1.1.0"         # SAF branch of the storage split — LLM.md §3.6
appcompat                   = "1.8.0"         # ONLY for AppCompatDelegate locale APIs (17-locale in-app picker)
firebaseBom                 = "34.18.0"       # messaging only; SDK internals out of scope
turbine                     = "1.2.1"
robolectric                 = "4.16.1"
# trustlook = UNKNOWN — no Maven coordinate exists anywhere in the corpus, only decompiled classes.
#             :feature:antivirus cannot build until procurement resolves it (r3-04:1222).

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# ------------------------------------------------------------------ Kotlin / coroutines / immutability
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }

# ------------------------------------------------------------------ Compose (BOM-governed, no versions)
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# ------------------------------------------------------------------ Lifecycle / navigation
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleRuntimeKtx" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# ------------------------------------------------------------------ DI (Koin)
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }
koin-androidx-workmanager = { group = "io.insert-koin", name = "koin-androidx-workmanager", version.ref = "koin" }
koin-test = { group = "io.insert-koin", name = "koin-test", version.ref = "koin" }
koin-test-junit4 = { group = "io.insert-koin", name = "koin-test-junit4", version.ref = "koin" }

# ------------------------------------------------------------------ Persistence
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# ------------------------------------------------------------------ Background
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }

# ------------------------------------------------------------------ Media / images
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-gif = { group = "io.coil-kt.coil3", name = "coil-gif", version.ref = "coil" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
lottie-compose = { group = "com.airbnb.android", name = "lottie-compose", version.ref = "lottie" }

# ------------------------------------------------------------------ Platform-adjacent
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

# ------------------------------------------------------------------ Test (no mocking library — hand-written fakes only, LLM.md §9)
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# kotlin-android — RESOLVED 2026-09-02: NOT needed, and it cannot be applied.
#   AGP 9's built-in Kotlin already registers the `kotlin` extension, so adding
#   org.jetbrains.kotlin.android fails at configuration time with
#     "Cannot add extension with name 'kotlin', as there is an extension already registered".
#   No module applies a Kotlin plugin. The one consequence is KSP: it registers its generated
#   sources through the `kotlin.sourceSets` DSL, which built-in Kotlin rejects, so
#   `android.disallowKotlinSourceSets=false` is set in gradle.properties. See the note there.

[bundles]
# What a module declares, so a build file states intent instead of a list (LLM.md §10.3).
compose = [
    "androidx-compose-ui", "androidx-compose-ui-graphics", "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3", "androidx-activity-compose",
    "androidx-lifecycle-runtime-compose", "androidx-lifecycle-viewmodel-compose",
    "androidx-navigation-compose",
]                                                       # every :feature:* and :core:ui
koin = ["koin-android", "koin-androidx-compose"]        # :app and every :feature:*
koin-data = ["koin-android", "koin-androidx-workmanager"]  # :data only
room = ["androidx-room-runtime", "androidx-room-ktx"]   # :data only
test-unit = ["junit", "kotlinx-coroutines-test", "turbine", "koin-test"]
test-android = ["androidx-junit", "androidx-espresso-core", "androidx-compose-ui-test-junit4"]

# Deliberately absent, each for a reason (r3-04-architecture-synthesis.md:1214-1224):
#   Gson              — kotlinx.serialization is already required by type-safe navigation
#   Glide / Picasso   — Coil owns the memory cache, request cancellation on recompose, placeholder slots
#   XXPermissions     — ActivityResultContracts + explicit Settings.ACTION_* intents instead
#   LiveEventBus      — Room is the notification
#   Retrofit / OkHttp — the app needs no JSON HTTP client; add OkHttp ONLY if the speed test ships
#   any mocking lib   — every fixture is a hand-written fake (LLM.md §9)
#   TrustLook SDK     — no Maven coordinate exists in the corpus; see [versions]
